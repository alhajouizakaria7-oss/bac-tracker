<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>BAC 2027 & TCF Elite Tracker</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
<style>body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif}</style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-12">
<header class="border-b border-slate-800 bg-slate-900/60 backdrop-blur sticky top-0 z-50"><div class="max-w-5xl mx-auto px-4 py-4 flex flex-wrap justify-between items-center gap-4"><div class="flex items-center space-x-3"><div class="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center font-bold text-xl">⚡</div><div><h1 class="font-extrabold text-lg text-white tracking-wide">BAC PC & TCF TRACKER</h1><p class="text-xs text-slate-400">Objectif : Mention TB + C1 TCF + France</p></div></div><div class="bg-slate-800/80 border border-slate-700 px-4 py-1.5 rounded-full"><span class="text-xs text-slate-300">TCF Octobre : <strong id="tcf-countdown" class="text-emerald-400">-- jours</strong></span></div></div></header>
<main class="max-w-5xl mx-auto px-4 mt-8"><div class="flex items-center overflow-x-auto gap-2 pb-3 mb-6" id="days-nav"></div><div class="grid grid-cols-1 lg:grid-cols-3 gap-6"><div class="lg:col-span-2 space-y-6"><div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl"><div class="flex justify-between items-start mb-4"><div><span class="text-xs font-semibold uppercase tracking-wider text-blue-400" id="current-day-tag">Jour</span><h2 class="text-2xl font-bold text-white mt-1" id="current-day-title">Programme du Jour</h2></div><span class="text-2xl" id="day-emoji">🎯</span></div><div class="mt-4"><div class="flex justify-between text-xs text-slate-400 mb-1.5"><span>Progression</span><span id="progress-percent">0%</span></div><div class="w-full h-2.5 bg-slate-800 rounded-full overflow-hidden"><div id="progress-bar" class="h-full bg-gradient-to-r from-blue-500 to-emerald-400 transition-all w-0"></div></div></div></div><div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl"><h3 class="text-sm font-semibold text-slate-400 uppercase tracking-wider mb-4"><i class="fa-solid fa-list-check text-blue-400"></i> Blocs de Révision & Objectifs</h3><div class="space-y-3" id="tasks-container"></div></div></div><div class="space-y-6"><div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl text-center"><h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3"><i class="fa-solid fa-stopwatch text-indigo-400"></i> Mode Focus (45 Min)</h3><div class="text-5xl font-extrabold text-white my-4 font-mono" id="timer-display">45:00</div><button onclick="toggleTimer()" id="timer-btn" class="px-5 py-2 bg-blue-600 text-white text-sm font-semibold rounded-xl">Démarrer</button><button onclick="resetTimer()" class="px-4 py-2 ml-2 bg-slate-800 text-slate-300 text-sm font-semibold rounded-xl">Reset</button></div><div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl"><h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3"><i class="fa-solid fa-folder-open text-emerald-400"></i> Arsenal Rapide</h3><div class="space-y-2 text-sm"><a href="https://apprendre.tv5monde.com/fr/tcf" target="_blank" class="block p-3 rounded-xl bg-slate-800/60">🎧 TV5Monde TCF ↗</a><a href="https://neosvt.com" target="_blank" class="block p-3 rounded-xl bg-slate-800/60">🧬 NéoSVT ↗</a><a href="https://pdfmath.com" target="_blank" class="block p-3 rounded-xl bg-slate-800/60">√ PDFMath (Lydex) ↗</a></div></div></div></div></main>
<script>
const schedule={1:['Lundi','Focus Maths & TCF','📘',[['19:30 - 21:15','Mathématiques : Limites & Continuité','Polycopié Prof. Benabicha (Calculs + Démonstrations)'],['21:30 - 22:30','Révision des cours du lycée','Refaire les applications du jour'],['22:30 - 23:00','TCF Express : Upgrading Vocab','Noter 5 structures C1 sur le cahier']]],2:['Mardi','Physique & SVT','⚡',[['19:30 - 21:15','Physique-Chimie : Les Ondes Mécaniques','Polycopié Prof. Saïd El Omrani (Exercices d’application)'],['21:30 - 22:30','SVT : Consommation de la matière organique','Schéma-bilan de la glycolyse (NéoSVT)'],['22:30 - 23:00','TCF : Compréhension Orale Express','1 série de questions sur TV5Monde']]],3:['Mercredi','Maths & Philosophie','🧠',[['19:30 - 21:15','Mathématiques : Continuité & TVI','Théorème des valeurs intermédiaires (Benabicha)'],['21:30 - 22:30','Philosophie : La Condition Humaine','Fiche concept : La personne et l’identité'],['22:30 - 23:00','TCF : Vocabulaire Argumentatif','Expressions pour la Tâche 3 (Pour/Contre)']]],4:['Jeudi','Chimie & SVT','🔬',[['19:30 - 21:15','Chimie : Transformations lentes et rapides','Facteurs cinétiques & Suivi temporel (El Omrani)'],['21:30 - 22:30','SVT : QCM & Définitions Clés','Restitution des connaissances (Fiche NéoSVT)'],['22:30 - 23:00','TCF Express : Structure de phrases','Connecteurs logiques formels']]],5:['Vendredi','Synthèse & Rédaction','✍️',[['19:30 - 21:15','Maths / Physique : Devoirs surveillés','Préparation des contrôles continus de la semaine'],['21:30 - 22:30','Philosophie : Analyse de citation','Structure de l’introduction et problématique'],['22:30 - 23:00','TCF : Rédaction courte','Écrire un paragraphe argumenté (120 mots)']]],6:['Samedi','Grand Test TCF & Détente','🎯',[['15:00 - 17:00','Simulation Complète TCF (Livre 3 / TV5)','Compréhension Orale + Écrite chronométrée'],['17:00 - 18:30','Correction & Analyse des erreurs TCF','Noter les pièges sur le cahier'],['Soirée','Déconnexion & Repos complet','Sortie, sport, détente totale']]],0:['Dimanche','Problèmes de Synthèse','🏆',[['09:30 - 12:30','Grand Problème Maths de Synthèse','Étude complète d’une fonction (Benabicha / Lydex)'],['15:00 - 17:30','Problème National Physique-Chimie','Session complète de 2h30 sans interruption'],['18:00 - 19:00','Organisation de la semaine suivante','Vérifier l’arsenal et les devoirs']]]};
let activeDay=new Date().getDay();
function renderDaysNav(){let n=document.getElementById('days-nav');n.innerHTML='';[1,2,3,4,5,6,0].forEach(k=>{let b=document.createElement('button');b.className='px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap '+(k===activeDay?'bg-blue-600 text-white':'bg-slate-900 text-slate-400 border border-slate-800');b.textContent=schedule[k][2]+' '+schedule[k][0];b.onclick=()=>{activeDay=k;loadDay();renderDaysNav()};n.appendChild(b)})}
function loadDay(){let d=schedule[activeDay];document.getElementById('current-day-tag').textContent=d[1];document.getElementById('current-day-title').textContent='Programme du '+d[0];document.getElementById('day-emoji').textContent=d[2];let c=document.getElementById('tasks-container');c.innerHTML='';d[3].forEach((t,i)=>{let id=activeDay+'-'+i,checked=localStorage.getItem('task_'+id)==='true',x=document.createElement('div');x.className='p-4 rounded-xl border border-slate-700/60 bg-slate-800/40 flex items-start gap-3 '+(checked?'opacity-60':'');x.innerHTML='<input type="checkbox" '+(checked?'checked':'')+' class="mt-1 w-5 h-5" onchange="toggleTask(\''+id+'\')"><div><span class="text-[11px] font-bold text-slate-400">'+t[0]+'</span><h4 class="text-sm font-bold text-white mt-1 '+(checked?'line-through':'')+'">'+t[1]+'</h4><p class="text-xs text-slate-400">'+t[2]+'</p></div>';c.appendChild(x)});updateProgress()}
function toggleTask(id){localStorage.setItem('task_'+id,(localStorage.getItem('task_'+id)!=='true'));loadDay()}function updateProgress(){let d=schedule[activeDay],done=d[3].filter((_,i)=>localStorage.getItem('task_'+activeDay+'-'+i)==='true').length,p=Math.round(done/d[3].length*100);document.getElementById('progress-percent').textContent=p+'%';document.getElementById('progress-bar').style.width=p+'%'}
function updateTCFCountdown(){let days=Math.max(0,Math.floor((new Date('2026-10-25T00:00:00')-new Date())/864e5));document.getElementById('tcf-countdown').textContent=days+' jours'}let timerTime=2700,timerInterval=null;function updateTimerDisplay(){document.getElementById('timer-display').textContent=String(Math.floor(timerTime/60)).padStart(2,'0')+':'+String(timerTime%60).padStart(2,'0')}function toggleTimer(){let b=document.getElementById('timer-btn');if(timerInterval){clearInterval(timerInterval);timerInterval=null;b.textContent='Reprendre'}else{timerInterval=setInterval(()=>{if(timerTime>0){timerTime--;updateTimerDisplay()}else{resetTimer();alert('Session terminée ! Prends 10 min de pause.')}},1000);b.textContent='Pause'}}function resetTimer(){clearInterval(timerInterval);timerInterval=null;timerTime=2700;updateTimerDisplay();document.getElementById('timer-btn').textContent='Démarrer'}renderDaysNav();loadDay();updateTCFCountdown();updateTimerDisplay();
</script></body></html>
