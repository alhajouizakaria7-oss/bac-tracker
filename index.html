<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BAC PC & TCF Elite Tracker</title>
<script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-12">
<header class="border-b border-slate-800 bg-slate-900/60 sticky top-0 z-50"><div class="max-w-5xl mx-auto px-4 py-4 flex flex-wrap justify-between items-center gap-4"><div class="flex items-center gap-3"><div class="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center text-xl">⚡</div><div><h1 class="font-extrabold text-lg">BAC PC & TCF TRACKER</h1><p class="text-xs text-slate-400">Mention Très Bien • Objectif France</p></div></div><div class="bg-slate-800 border border-slate-700 px-4 py-2 rounded-full text-xs">🟢 TCF Octobre : <strong id="count" class="text-emerald-400"></strong></div></div></header>
<main class="max-w-5xl mx-auto px-4 mt-8"><nav id="days" class="flex overflow-x-auto gap-2 pb-3 mb-6"></nav><div class="grid lg:grid-cols-3 gap-6"><section class="lg:col-span-2 space-y-6"><div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl"><div class="flex justify-between"><div><span id="tag" class="text-xs uppercase text-blue-400"></span><h2 id="title" class="text-2xl font-bold mt-1"></h2></div><span id="emoji" class="text-3xl"></span></div><div class="mt-5 text-xs text-slate-400 flex justify-between"><span>Progression du jour</span><span id="pct">0%</span></div><div class="h-2.5 bg-slate-800 rounded-full overflow-hidden"><div id="bar" class="h-full bg-gradient-to-r from-blue-500 to-emerald-400"></div></div></div><div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl"><h3 class="text-xs uppercase text-slate-400 mb-3">➕ Ajouter une session au programme</h3><form id="form" class="space-y-3"><div class="grid sm:grid-cols-3 gap-3"><input id="time" required placeholder="Horaire (ex: 19:30 - 21:15)" class="bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm"><input id="name" required placeholder="Matière & titre" class="sm:col-span-2 bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm"></div><div class="flex gap-2"><input id="desc" required placeholder="Détails" class="flex-1 bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm"><button class="px-4 py-2 bg-blue-600 rounded-xl text-sm">Ajouter</button></div></form></div><div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl"><h3 class="text-sm uppercase text-slate-400 mb-4">☑ Objectifs du jour</h3><div id="tasks" class="space-y-3"></div></div></section><aside class="space-y-6"><div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl text-center"><h3 class="text-xs uppercase text-slate-400">⏱ Mode Focus (45 Min)</h3><div id="timer" class="text-5xl font-mono font-bold my-4">45:00</div><button id="start" class="px-5 py-2 bg-blue-600 rounded-xl">Démarrer</button> <button id="reset" class="px-4 py-2 bg-slate-800 rounded-xl">Reset</button></div><div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl"><h3 class="text-xs uppercase text-slate-400 mb-4">⚡ Arsenal Rapide</h3><div class="space-y-2 text-sm"><a class="block p-3 rounded-xl bg-slate-800" href="docs/polycope_maths.pdf" target="_blank">∑ Maths (Benabicha)</a><a class="block p-3 rounded-xl bg-slate-800" href="docs/polycope_physique.pdf" target="_blank">⚛ Phys-Chimie (El Omrani)</a><a class="block p-3 rounded-xl bg-slate-800" href="https://t.me/+QJtrn_IfrNk4MGE0" target="_blank">Telegram TCF Académie</a><div class="flex gap-2"><a class="flex-1 text-center p-2 bg-slate-800 rounded" href="https://apprendre.tv5monde.com/fr/tcf" target="_blank">TV5Monde</a><a class="flex-1 text-center p-2 bg-slate-800 rounded" href="https://neosvt.com" target="_blank">NéoSVT</a></div></div></div></aside></div></main>
<script>
const base={1:['Lundi','Focus Maths & TCF','📘',[['19:30 - 21:15','Mathématiques : Limites & Continuité','Polycopié Prof. Benabicha'],['22:30 - 23:00','TCF Express : Upgrading Vocab','Noter 5 structures C1']]],2:['Mardi','Physique & SVT','⚡',[['19:30 - 21:15','Physique-Chimie : Les Ondes','Polycopié Prof. Saïd El Omrani'],['21:30 - 22:30','SVT : Glycolyse & Bilan','Schéma-bilan NéoSVT']]],3:['Mercredi','Maths & Philosophie','🧠',[['19:30 - 21:15','Mathématiques : TVI & Continuité','Polycopié Benabicha'],['21:30 - 22:30','Philosophie : La Personne','Fiche concept']]],4:['Jeudi','Chimie & SVT','🔬',[['19:30 - 21:15','Chimie : Cinétique chimique','Polycopié El Omrani'],['22:30 - 23:00','TCF : Structures argumentatives','Connecteurs formels']]],5:['Vendredi','Synthèse & Rédaction','✍️',[['19:30 - 21:15','Maths / Physique : Devoirs surveillés','Applications et synthèse'],['22:30 - 23:00','TCF : Rédaction Tâche 3','Paragraphe de 120 mots']]],6:['Samedi','Grand Test TCF & Détente','🎯',[['15:00 - 17:00','Simulation Complète TCF','TV5Monde / Test blanc'],['17:00 - 18:30','Analyse des erreurs TCF','Vocabulaire C1']]],0:['Dimanche','Problèmes de Synthèse','🏆',[['09:30 - 12:30','Grand Problème de Maths','Étude complète d’une fonction'],['15:00 - 17:30','National Physique-Chimie','Session continue']]]};
let key='bac_tracker_final_2026',data=JSON.parse(localStorage.getItem(key)||'null')||Object.fromEntries(Object.entries(base).map(([k,v])=>[k,v[3].map((x,i)=>({id:i,time:x[0],title:x[1],desc:x[2],done:false}))])),active=new Date().getDay();
const save=()=>localStorage.setItem(key,JSON.stringify(data));function render(){let d=base[active],ts=data[active]||[];tag.textContent=d[1];title.textContent='Programme du '+d[0];emoji.textContent=d[2];tasks.innerHTML=ts.length?ts.map((t,i)=>`<div class="p-4 rounded-xl border border-slate-700 flex justify-between"><label><input type="checkbox" ${t.done?'checked':''} onchange="data[active][${i}].done=this.checked;save();render()"> <b class="${t.done?'line-through':''}">${t.title}</b><p class="text-xs text-slate-400">${t.time} · ${t.desc}</p></label><button onclick="data[active].splice(${i},1);save();render()">🗑</button></div>`).join(''):'<p class="text-slate-500">Aucune tâche.</p>';let n=ts.filter(t=>t.done).length;pct.textContent=(ts.length?Math.round(n/ts.length*100):0)+'%';bar.style.width=pct.textContent}Object.keys(base).sort((a,b)=>[1,2,3,4,5,6,0].indexOf(+a)-[1,2,3,4,5,6,0].indexOf(+b)).forEach(k=>{let b=document.createElement('button');b.className='px-4 py-2 rounded-xl bg-slate-900 border border-slate-800 whitespace-nowrap';b.textContent=base[k][2]+' '+base[k][0];b.onclick=()=>{active=+k;render()};days.append(b)});form.onsubmit=e=>{e.preventDefault();(data[active]??=[]).push({time:time.value,title:name.value,desc:desc.value,done:false});save();form.reset();render()};render();let target=new Date('2026-10-25'),set=()=>count.textContent=Math.max(0,Math.floor((target-new Date())/864e5))+' jours';set();
let left=2700,interval;function clock(){timer.textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0')}start.onclick=()=>{if(interval){clearInterval(interval);interval=null;start.textContent='Reprendre'}else{interval=setInterval(()=>{if(left)left--;clock()},1000);start.textContent='Pause'}};reset.onclick=()=>{clearInterval(interval);interval=null;left=2700;clock();start.textContent='Démarrer'};
</script></body></html>
